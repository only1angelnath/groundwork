[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
libraries = ["lib/usc-contracts/contracts/decoding/EvmV1Decoder.sol:EvmV1Decoder:0x16b79d87f11883bb57a3d42480804B637e5a2f8D"]
optimizer = true
optimizer_runs = 200
via_ir = false

# Deployer / relayer private keys and RPC URLs are read from environment
# variables at deploy time (see .env.example) — never hardcode a key here.

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
creditcoin_testnet = "${CREDITCOIN_TESTNET_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111 }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
