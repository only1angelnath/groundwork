[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
# svm's default download host (binaries.soliditylang.org) is blocked in this
# sandbox's network policy, so solc is installed manually and pinned here.
# On a normal dev machine you can delete this line and let `forge build`
# auto-download 0.8.24 via svm the standard way.
solc = "/home/claude/.solc/solc-0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false

# Deployer / relayer private keys and RPC URLs are read from environment
# variables at deploy time (see .env.example) — never hardcode a key here.

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
creditcoin_testnet = "${CREDITCOIN_TESTNET_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111 }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
